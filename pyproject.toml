[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmnas-repro"
version = "0.1.0"
description = "Reproduction of LLM-NAS: LLM-driven Hardware-Aware Neural Architecture Search (arXiv:2510.01472)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "xgboost>=2.0",
  "matplotlib>=3.7", "pyyaml>=6.0", "tabulate>=0.9", "openai>=1.40", "gdown>=5.0", "nats_bench>=1.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
llmnas = "llmnas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
